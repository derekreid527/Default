<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Bill Tracker</h1>
      <p class="subtitle">Stay on top of your bills</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card card--total">
        <span class="card__label">Total Due</span>
        <span class="card__value" id="totalDue">$0.00</span>
      </div>
      <div class="card card--paid">
        <span class="card__label">Paid</span>
        <span class="card__value" id="totalPaid">$0.00</span>
      </div>
      <div class="card card--unpaid">
        <span class="card__label">Remaining</span>
        <span class="card__value" id="totalUnpaid">$0.00</span>
      </div>
      <div class="card card--overdue">
        <span class="card__label">Overdue</span>
        <span class="card__value" id="overdueCount">0</span>
      </div>
    </section>

    <!-- Add / Edit Form -->
    <section class="form-section">
      <h2 id="formTitle">Add Bill</h2>
      <form id="billForm">
        <input type="hidden" id="editId" />
        <div class="form-row">
          <div class="field">
            <label for="billName">Bill Name</label>
            <input type="text" id="billName" placeholder="e.g. Electricity" required />
          </div>
          <div class="field">
            <label for="billAmount">Amount ($)</label>
            <input type="number" id="billAmount" placeholder="0.00" step="0.01" min="0" required />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="billDue">Due Date</label>
            <input type="date" id="billDue" required />
          </div>
          <div class="field">
            <label for="billCategory">Category</label>
            <select id="billCategory">
              <option value="Utilities">Utilities</option>
              <option value="Rent / Mortgage">Rent / Mortgage</option>
              <option value="Insurance">Insurance</option>
              <option value="Subscription">Subscription</option>
              <option value="Loan">Loan</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="billNotes">Notes (optional)</label>
          <input type="text" id="billNotes" placeholder="Any extra details…" />
        </div>
        <div class="form-actions">
          <button type="submit" id="submitBtn">Add Bill</button>
          <button type="button" id="cancelBtn" class="btn--secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Filters -->
    <section class="filters">
      <div class="filter-group">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="all">All</option>
          <option value="unpaid">Unpaid</option>
          <option value="paid">Paid</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterCategory">Category</label>
        <select id="filterCategory">
          <option value="all">All</option>
          <option value="Utilities">Utilities</option>
          <option value="Rent / Mortgage">Rent / Mortgage</option>
          <option value="Insurance">Insurance</option>
          <option value="Subscription">Subscription</option>
          <option value="Loan">Loan</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="sortBy">Sort By</label>
        <select id="sortBy">
          <option value="dueDate">Due Date</option>
          <option value="amount">Amount</option>
          <option value="name">Name</option>
        </select>
      </div>
    </section>

    <!-- Bills List -->
    <section class="bills-section">
      <div id="billsList" class="bills-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <p>No bills found. Add one above!</p>
      </div>
    </section>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal__box">
      <p>Delete this bill?</p>
      <div class="modal__actions">
        <button id="confirmDelete" class="btn--danger">Delete</button>
        <button id="cancelDelete" class="btn--secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
